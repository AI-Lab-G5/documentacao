      examples:
      - &id001
        id: rev-1
        recordId: rec-1
        revision: 1
        previousRevisionId: null
        quantity: '1'
        unit: MWh
        state: active
        authorUid: user-1
        createdAt: '2026-10-23T12:00:00Z'
        justification: null
    ActivityRecord:
      type: object
      additionalProperties: false
      required:
      - id
      - facilityId
      - sourceId
      - period
      - currentRevision
      properties:
        id:
          type: string
        facilityId:
          type: string
        sourceId:
          type: string
        period:
          $ref: '#/components/schemas/Period'
        currentRevision:
          $ref: '#/components/schemas/ActivityRevision'
      examples:
