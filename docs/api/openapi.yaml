      - funcionario
      parameters:
      - $ref: '#/components/parameters/CalculationIdQuery'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
  /dashboard/outliers:
    get:
      tags:
      - J4
      operationId: getOutliers
      summary: Consultar alertas pela mediana
      description: 'Somente completas/ativas com >=1 fonte. >=3 elegíveis e mediana>0: abs((valor-mediana)/mediana*100)>50,
        antes de arredondar. Igual a 50 não alerta. Menos de 3: insufficient_sample; caso contrário mediana zero:
        zero_median. Nesses casos items=[] e nenhuma classificação. Operacional, sem alegação estatística/eficiência;
        mediana usa todo o snapshot, não a página.'
      responses:
        '200':
          description: Operação concluída
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OutlierAnalysis'
              example:
                calculationId: calc-demo
                status: ok
                eligibleFacilityCount: 3
                medianKgCo2e: '100'
                thresholdPercentage: '50'
                items:
                - facilityId: fac-3
                  emissionKgCo2e: '200'
                  deviationPercentage: '100'
                nextCursor: null
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '422':
          $ref: '#/components/responses/Error422'
      x-roles:
      - funcionario
      parameters:
      - $ref: '#/components/parameters/CalculationIdQuery'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
  /reports:
    post:
      tags:
      - J5
      operationId: generateReport
      summary: Gerar PDF ou CSV síncrono do snapshot
      description: Must do MVP até 05/12, fora das 20 issues CP2. Ambos usam mesmo calculationId imutável e incluem
        referências/revisões, fatores, metodologia, UID/datas e pendências/preliminaridade. Sem aprovação, fechamento,
        job, Storage obrigatório ou manifesto. CSV vazio contém cabeçalho; PDF vazio explica ausência de registros.
      responses:
        '200':
          description: Arquivo conforme formato solicitado; nome e MIME coerentes. Dados do snapshot não mudam;
            data de geração pode mudar.
          headers:
            Content-Disposition:
              description: attachment; filename=carbontrace.pdf ou carbontrace.csv
              schema:
                type: string
          content:
            application/pdf:
              schema:
                type: string
                format: binary
            text/csv:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '422':
          $ref: '#/components/responses/Error422'
      x-roles:
      - funcionario
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportRequest'
            example:
              calculationId: calc-A
              format: pdf
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token Firebase verificado pela API; claims tenant_id e papel=funcionario.
  parameters:
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
        minLength: 1
    Period:
      name: period
      in: query
      schema:
        $ref: '#/components/schemas/Period'
    FacilityFilter:
      name: facilityId
      in: query
      schema:
        type: string
    CalculationIdQuery:
      name: calculationId
      in: query
      required: true
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
      description: Escopo tenant+usuário+operação+recurso; janela 24h; mesma chave com payload diferente retorna
        409.
    facilityId:
      name: facilityId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    sourceId:
      name: sourceId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    recordId:
      name: recordId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    calculationId:
      name: calculationId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    versionId:
      name: versionId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
  schemas:
    DecimalString:
      type: string
      pattern: ^-?\d+(\.\d+)?$
      description: Decimal finito exato, sem notação científica; nunca um número JSON.
    QuantityString:
      type: string
      pattern: ^\d+(\.\d+)?$
      description: Decimal finito >=0; precisão suportada validada pela API sem arredondamento silencioso.
    Period:
      type: string
      pattern: ^\d{4}-(0[1-9]|1[0-2])$
    SourceType:
      type: string
      enum:
      - electricity
      - diesel
      - gasoline
      - lpg
    Unit:
      type: string
      enum:
      - kWh
      - MWh
      - L
      - kg
    Reason:
      type: string
      minLength: 1
      pattern: \S
      description: Motivo com pelo menos um caractere não branco.
    UserProfile:
      type: object
      additionalProperties: false
      required:
      - uid
      - tenantId
      - role
      properties:
        uid:
          type: string
        tenantId:
          type: string
        role:
          type: string
          enum:
          - funcionario
      examples:
      - uid: user-1
        tenantId: empresa-a
        role: funcionario
    FacilityCreate:
      type: object
      additionalProperties: false
      required:
      - code
      - name
      properties:
        code:
          type: string
          minLength: 1
          pattern: \S
        name:
          type: string
          minLength: 1
          pattern: \S
      examples:
      - code: LOJA-01
        name: Loja Centro
    FacilityUpdate:
      type: object
      additionalProperties: false
      required: []
      properties:
        code:
          type: string
          minLength: 1
          pattern: \S
        name:
          type: string
          minLength: 1
          pattern: \S
        isActive:
          type: boolean
      minProperties: 1
    Facility:
      type: object
      additionalProperties: false
      required:
      - id
      - code
      - name
      - isActive
      properties:
        id:
          type: string
        code:
          type: string
        name:
          type: string
        isActive:
          type: boolean
      examples:
      - id: fac-1
        code: LOJA-01
        name: Loja Centro
        isActive: true
    EmissionSourceCreate:
      type: object
      additionalProperties: false
      required:
      - type
      properties:
        type:
          $ref: '#/components/schemas/SourceType'
    EmissionSourceUpdate:
      type: object
      additionalProperties: false
      required:
      - isActive
      properties:
        isActive:
          type: boolean
    EmissionSource:
      type: object
      additionalProperties: false
      required:
      - id
      - facilityId
      - type
      - isActive
      properties:
        id:
          type: string
        facilityId:
          type: string
        type:
          $ref: '#/components/schemas/SourceType'
        isActive:
          type: boolean
    SourceCatalogEntry:
      type: object
      additionalProperties: false
      required:
      - type
      - scope
      - baseUnit
      - acceptedUnits
      properties:
        type:
          $ref: '#/components/schemas/SourceType'
        scope:
          type: string
          enum:
          - '1'
          - '2'
        baseUnit:
          $ref: '#/components/schemas/Unit'
        acceptedUnits:
          type: array
          items:
            $ref: '#/components/schemas/Unit'
    ActivityRecordCreate:
      type: object
      additionalProperties: false
      required:
      - sourceId
      - period
      - quantity
      - unit
      properties:
        sourceId:
          type: string
        period:
          $ref: '#/components/schemas/Period'
        quantity:
          $ref: '#/components/schemas/QuantityString'
        unit:
