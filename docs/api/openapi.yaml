        currentRevision: *id001
    Factor:
      type: object
      additionalProperties: false
      required:
      - sourceType
      - scope
      - baseUnit
      - kgCo2ePerUnit
      - reference
      - status
      properties:
        sourceType:
          $ref: '#/components/schemas/SourceType'
        scope:
          type: string
