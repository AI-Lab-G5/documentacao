openapi: 3.1.0
info:
  title: CarbonTrace API — contrato-alvo
  version: 0.2.0
  description: Comportamento planejado conforme ADR-008 (23/10/2026), não comprovação de implementação. Um perfil
    funcionario acessa todas as unidades do próprio tenant. Claims tenant_id/papel, sem tenant selecionável pelo
    cliente. Decimal em strings; sem quatro perfis, aprovação, fechamento, publicação de fatores pela API ou hashes
    obrigatórios. J1–J4 no CP2, J5 obrigatória no MVP posterior.
servers:
- url: /v1
  description: Prefixo do contrato-alvo, distinto das rotas implementadas atuais.
tags:
- name: Transversal
  description: Saúde e identidade
- name: J1
  description: Unidades e fontes
- name: J2
  description: Coleta, correção e cancelamento
- name: J3
  description: Fatores e snapshots reproduzíveis
- name: J4
  description: Consolidação, ranking e alertas
- name: J5
  description: PDF/CSV rastreável
security:
- bearerAuth: []
paths:
  /health:
    get:
      tags:
      - Transversal
      operationId: getHealth
      summary: Verificar saúde
      description: Verificar saúde. Contrato-alvo; consultar ADR-008.
      responses:
        '200':
          description: Operação concluída
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
              example:
                status: ok
        '400':
          description: Requisição HTTP malformada.
      security: []
  /me:
    get:
      tags:
      - Transversal
      operationId: getMe
      summary: Consultar identidade e empresa
      description: Consultar identidade e empresa. Contrato-alvo; consultar ADR-008.
      responses:
        '200':
          description: Operação concluída
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
              example:
                uid: user-1
                tenantId: empresa-a
                role: funcionario
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '422':
          $ref: '#/components/responses/Error422'
      x-roles:
      - funcionario
  /facilities:
    get:
      tags:
      - J1
      operationId: listFacilities
      summary: Listar unidades
      description: Listar unidades. Contrato-alvo; consultar ADR-008.
      responses:
        '200':
          description: Operação concluída
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FacilityPage'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '422':
          $ref: '#/components/responses/Error422'
      x-roles:
      - funcionario
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
    post:
      tags:
      - J1
      operationId: createFacility
      summary: Cadastrar unidade
      description: Cadastrar unidade. Contrato-alvo; consultar ADR-008.
      responses:
        '201':
          description: Operação concluída
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Facility'
              example:
                id: fac-1
                code: LOJA-01
                name: Loja Centro
                isActive: true
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '422':
          $ref: '#/components/responses/Error422'
      x-roles:
      - funcionario
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FacilityCreate'
            example:
              code: LOJA-01
              name: Loja Centro
  /facilities/{facilityId}:
    get:
      tags:
      - J1
      operationId: getFacility
      summary: Consultar unidade
      description: Consultar unidade. Contrato-alvo; consultar ADR-008.
      responses:
        '200':
          description: Operação concluída
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Facility'
              example:
                id: fac-1
                code: LOJA-01
                name: Loja Centro
                isActive: true
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '422':
          $ref: '#/components/responses/Error422'
      x-roles:
      - funcionario
      parameters:
      - $ref: '#/components/parameters/facilityId'
    patch:
      tags:
      - J1
      operationId: updateFacility
      summary: Editar ou desativar unidade
      description: Desativação bloqueia novas coletas, sem apagar entradas ou alterar snapshots anteriores.
      responses:
        '200':
          description: Operação concluída
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Facility'
              example:
                id: fac-1
                code: LOJA-01
                name: Loja Centro
                isActive: true
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '422':
          $ref: '#/components/responses/Error422'
      x-roles:
      - funcionario
      parameters:
      - $ref: '#/components/parameters/facilityId'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FacilityUpdate'
  /facilities/{facilityId}/sources:
    get:
      tags:
      - J1
      operationId: listSources
      summary: Consultar fontes vinculadas
      description: Consultar fontes vinculadas. Contrato-alvo; consultar ADR-008.
      responses:
        '200':
          description: Operação concluída
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmissionSourceList'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '422':
          $ref: '#/components/responses/Error422'
      x-roles:
      - funcionario
      parameters:
      - $ref: '#/components/parameters/facilityId'
    post:
      tags:
      - J1
      operationId: addSource
      summary: Vincular fonte do catálogo
      description: Vincular fonte do catálogo. Contrato-alvo; consultar ADR-008.
      responses:
        '201':
          description: Operação concluída
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmissionSource'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '422':
          $ref: '#/components/responses/Error422'
      x-roles:
      - funcionario
      parameters:
      - $ref: '#/components/parameters/facilityId'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmissionSourceCreate'
  /facilities/{facilityId}/sources/{sourceId}:
    patch:
      tags:
      - J1
      operationId: updateSource
      summary: Ativar ou desativar fonte
      description: Tipo não pode ser trocado. Não apagar lançamentos/cálculos anteriores nem subtrair dados silenciosamente.
      responses:
        '200':
          description: Operação concluída
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmissionSource'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '422':
          $ref: '#/components/responses/Error422'
      x-roles:
      - funcionario
      parameters:
      - $ref: '#/components/parameters/facilityId'
      - $ref: '#/components/parameters/sourceId'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmissionSourceUpdate'
  /catalogs/source-types:
    get:
      tags:
      - J1
      operationId: getSourceCatalog
      summary: Consultar quatro fontes permitidas
      description: Consultar quatro fontes permitidas. Contrato-alvo; consultar ADR-008.
      responses:
        '200':
          description: Operação concluída
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceCatalog'
              example:
              - type: electricity
                scope: '2'
                baseUnit: kWh
                acceptedUnits:
                - kWh
                - MWh
              - type: diesel
                scope: '1'
                baseUnit: L
                acceptedUnits:
                - L
              - type: gasoline
                scope: '1'
                baseUnit: L
                acceptedUnits:
                - L
              - type: lpg
                scope: '1'
                baseUnit: kg
                acceptedUnits:
                - kg
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '422':
          $ref: '#/components/responses/Error422'
      x-roles:
      - funcionario
  /facilities/{facilityId}/records:
    get:
      tags:
      - J2
      operationId: listRecords
      summary: Listar consumos mensais
      description: Listar consumos mensais. Contrato-alvo; consultar ADR-008.
      responses:
        '200':
          description: Operação concluída
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityRecordPage'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '422':
          $ref: '#/components/responses/Error422'
      x-roles:
      - funcionario
      parameters:
      - $ref: '#/components/parameters/facilityId'
      - $ref: '#/components/parameters/Period'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
    post:
      tags:
      - J2
      operationId: createRecord
      summary: Cadastrar consumo mensal
      description: Uma chave por unidade/fonte/competência. Fonte ativa; quantidade >=0; unidade compatível. Zero
        explícito é válido. Duplicidade retorna 409, salvo reenvio idempotente.
      responses:
        '201':
          description: Operação concluída
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityRecord'
              example:
                id: rec-1
                facilityId: fac-1
                sourceId: src-1
                period: 2026-10
                currentRevision:
                  id: rev-1
                  recordId: rec-1
                  revision: 1
                  previousRevisionId: null
                  quantity: '1'
                  unit: MWh
                  state: active
                  authorUid: user-1
                  createdAt: '2026-10-23T12:00:00Z'
                  justification: null
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '422':
          $ref: '#/components/responses/Error422'
      x-roles:
      - funcionario
      parameters:
      - $ref: '#/components/parameters/facilityId'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActivityRecordCreate'
            example:
              sourceId: src-1
              period: 2026-10
              quantity: '1'
              unit: MWh
  /facilities/{facilityId}/records/{recordId}:
    get:
      tags:
      - J2
      operationId: getRecord
      summary: Consultar lançamento corrente
      description: Consultar lançamento corrente. Contrato-alvo; consultar ADR-008.
      responses:
        '200':
          description: Operação concluída
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityRecord'
              example:
                id: rec-1
                facilityId: fac-1
                sourceId: src-1
                period: 2026-10
                currentRevision:
                  id: rev-1
                  recordId: rec-1
                  revision: 1
                  previousRevisionId: null
                  quantity: '1'
                  unit: MWh
                  state: active
                  authorUid: user-1
                  createdAt: '2026-10-23T12:00:00Z'
                  justification: null
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '422':
          $ref: '#/components/responses/Error422'
      x-roles:
      - funcionario
      parameters:
      - $ref: '#/components/parameters/facilityId'
      - $ref: '#/components/parameters/recordId'
  /facilities/{facilityId}/records/{recordId}/revisions:
    get:
      tags:
      - J2
      operationId: listRevisions
      summary: Consultar histórico de revisões
      description: Consultar histórico de revisões. Contrato-alvo; consultar ADR-008.
      responses:
        '200':
          description: Operação concluída
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityRevisionPage'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '422':
          $ref: '#/components/responses/Error422'
      x-roles:
      - funcionario
      parameters:
      - $ref: '#/components/parameters/facilityId'
      - $ref: '#/components/parameters/recordId'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
  /facilities/{facilityId}/records/{recordId}/correct:
    post:
      tags:
      - J2
      operationId: correctRecord
      summary: Corrigir quantidade preservando origem
      description: Cria revisão ativa com quantidade/unidade compatível, motivo e revisão-base. Não altera identificação
        unidade/fonte/competência; não corrige registro cancelado. Base desatualizada retorna 409. Reenvio idempotente
        retorna anterior sem nova revisão.
      responses:
        '201':
          description: Operação concluída
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityRecord'
              example:
                id: rec-1
                facilityId: fac-1
                sourceId: src-1
                period: 2026-10
                currentRevision:
                  id: rev-1
                  recordId: rec-1
                  revision: 1
                  previousRevisionId: null
                  quantity: '1'
                  unit: MWh
                  state: active
                  authorUid: user-1
                  createdAt: '2026-10-23T12:00:00Z'
                  justification: null
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '422':
          $ref: '#/components/responses/Error422'
      x-roles:
      - funcionario
      parameters:
      - $ref: '#/components/parameters/facilityId'
      - $ref: '#/components/parameters/recordId'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActivityRecordCorrection'
            example:
              baseRevision: 1
              quantity: '1.2'
              unit: MWh
              justification: Conferência da conta
  /facilities/{facilityId}/records/{recordId}/cancel:
    post:
      tags:
      - J2
      operationId: cancelRecord
      summary: Cancelar sem apagar histórico
      description: Após confirmação na interface, cria revisão cancelled e retira do total corrente. Preserva snapshot
        anterior e reserva a chave. Sem exclusão física ou reativação. Reenvio idempotente não gera revisão extra.
      responses:
        '201':
          description: Operação concluída
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityRecord'
              example:
                id: rec-1
                facilityId: fac-1
                sourceId: src-1
                period: 2026-10
                currentRevision:
                  id: rev-1
                  recordId: rec-1
                  revision: 1
                  previousRevisionId: null
                  quantity: '1'
                  unit: MWh
                  state: active
                  authorUid: user-1
                  createdAt: '2026-10-23T12:00:00Z'
                  justification: null
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '422':
          $ref: '#/components/responses/Error422'
      x-roles:
      - funcionario
      parameters:
      - $ref: '#/components/parameters/facilityId'
      - $ref: '#/components/parameters/recordId'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActivityRecordCancellation'
            example:
              baseRevision: 2
              justification: Lançamento indevido
  /factor-versions:
    get:
      tags:
      - J3
      operationId: listFactorVersions
      summary: Consultar versões preparadas pela equipe
      description: Consultar versões preparadas pela equipe. Contrato-alvo; consultar ADR-008.
      responses:
        '200':
          description: Operação concluída
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FactorVersionPage'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '422':
          $ref: '#/components/responses/Error422'
      x-roles:
      - funcionario
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
  /factor-versions/{versionId}:
    get:
      tags:
      - J3
      operationId: getFactorVersion
      summary: Consultar fatores imutáveis
      description: Consultar fatores imutáveis. Contrato-alvo; consultar ADR-008.
      responses:
        '200':
          description: Operação concluída
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FactorVersion'
              example:
                versionId: A
                validFrom: 2025-01
                methodologyVersion: simple-v1
                methodologyDescription: Fator agregado sintético somente para ensaio; não é fator ambiental homologado.
                factors:
                - sourceType: electricity
                  scope: '2'
                  baseUnit: kWh
                  kgCo2ePerUnit: '0.5'
                  reference: Massa sintética D01/D03
                  status: preliminary
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '422':
          $ref: '#/components/responses/Error422'
      x-roles:
      - funcionario
      parameters:
      - $ref: '#/components/parameters/versionId'
  /calculations:
    get:
      tags:
      - J3
      operationId: listCalculations
      summary: Listar snapshots salvos
      description: Listar snapshots salvos. Contrato-alvo; consultar ADR-008.
      responses:
        '200':
          description: Operação concluída
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalculationPage'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '422':
          $ref: '#/components/responses/Error422'
      x-roles:
      - funcionario
      parameters:
      - $ref: '#/components/parameters/Period'
      - $ref: '#/components/parameters/FacilityFilter'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
    post:
      tags:
      - J3
      operationId: createCalculation
      summary: Calcular e salvar snapshot corrente
      description: Captura uma revisão corrente não cancelada por lançamento, configurações, entradas, fatores compatíveis
        vigentes, conversões, metodologia e valores exatos. Inclui pendências e totais parciais rotulados. A opção
        facilityId restringe à unidade da própria empresa. Não exige aprovação/fechamento.
      responses:
        '201':
          description: Operação concluída
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Calculation'
              example:
                id: calc-A
                tenantId: empresa-a
                period: 2026-10
                methodologyVersion: simple-v1
                roundingPolicy: ROUND_HALF_EVEN
                displayDecimalPlaces: 3
                createdByUid: user-1
                createdAt: '2026-10-23T12:01:00Z'
                lines:
                - recordId: rec-A
                  revisionId: rev-A
                  facilityId: fac-1
                  sourceId: src-A
                  sourceType: electricity
                  scope: '2'
                  originalQuantity: '100'
                  originalUnit: kWh
                  conversionMultiplier: '1'
                  baseQuantity: '100'
                  baseUnit: kWh
                  factorVersionId: A
                  factorValue: '0.5'
                  factorReference: Massa sintética D03
                  factorStatus: preliminary
                  methodologyVersion: simple-v1
                  emissionKgCo2e: '50'
                  authorUid: user-1
                  recordedAt: '2026-10-23T12:00:00Z'
                facilities:
                - facilityId: fac-1
                  code: LOJA-01
                  name: Loja Centro
                  isActive: true
                  expectedSourceIds:
                  - src-A
                  missingSourceIds: []
                  complete: true
                  scope1KgCo2e: '0'
                  scope2KgCo2e: '50'
                  totalKgCo2e: '50'
                scope1KgCo2e: '0'
                scope2KgCo2e: '50'
                totalKgCo2e: '50'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '422':
          $ref: '#/components/responses/Error422'
      x-roles:
      - funcionario
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
