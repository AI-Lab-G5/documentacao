openapi: 3.1.0
info:
  title: CarbonTrace API
  version: 0.1.0
  description: |
    API para o sistema CarbonTrace (Pegada Rede).
    O tenant é sempre inferido a partir do token de autenticação (tenantId). Nenhum tenantId deve ser enviado na via (path), query ou corpo (body).
    Valores exatos (quantidades, fatores, emissões) são sempre trafegados como string decimal canónica.
servers:
  - url: /v1
tags:
  - name: Transversal
    description: Operações gerais e de saúde do sistema
  - name: J1
    description: Cadastros de unidades e fontes
  - name: J2
    description: Registos de atividade mensal e aprovações
  - name: J3
    description: Fatores de emissão e cálculos
  - name: J4
    description: Dashboards e agregados da rede
  - name: J5
    description: Relatórios e trilha de auditoria
paths:
  /health:
    get:
      tags: [Transversal]
      summary: Verificar saúde da API
      description: Endpoint público para verificação de uptime.
      operationId: getHealth
      security: []
      responses:
        '200':
          description: API operacional
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
  /me:
    get:
      tags: [Transversal]
      summary: Obter perfil do utilizador
      description: Retorna os dados, tenant e papel (role) do utilizador autenticado.
      operationId: getMe
      x-roles: ["admin_esg", "analista_controladoria", "operador_unidade", "auditor"]
      responses:
        '200':
          description: Perfil do utilizador
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /facilities:
    get:
      tags: [J1]
      summary: Listar unidades
      description: Lista as unidades (franquias/filiais) do tenant com paginação por cursor.
      operationId: listFacilities
      x-roles: ["admin_esg", "analista_controladoria", "operador_unidade", "auditor"]
      parameters:
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/CursorParam'
      responses:
        '200':
          description: Lista paginada de unidades
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Facility'
                  nextCursor:
                    type: ["string", "null"]
    post:
      tags: [J1]
      summary: Criar unidade
      description: Cadastra uma nova unidade.
      operationId: createFacility
      x-roles: ["admin_esg"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FacilityCreate'
      responses:
        '201':
          description: Unidade criada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Facility'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /facilities/{facilityId}:
    patch:
      tags: [J1]
      summary: Atualizar ou desativar unidade
      description: Atualiza os dados de uma unidade ou marca como inativa (exclusão lógica).
      operationId: updateFacility
      x-roles: ["admin_esg"]
      parameters:
        - $ref: '#/components/parameters/FacilityIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FacilityUpdate'
      responses:
        '200':
          description: Unidade atualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Facility'
        '404':
          $ref: '#/components/responses/NotFound'

  /facilities/{facilityId}/sources:
    post:
      tags: [J1]
      summary: Adicionar fonte de emissão à unidade
      description: Vincula uma fonte de emissão (ex. Eletricidade, Frota) a uma unidade.
      operationId: addEmissionSource
      x-roles: ["admin_esg"]
      parameters:
        - $ref: '#/components/parameters/FacilityIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmissionSourceCreate'
      responses:
        '201':
          description: Fonte de emissão vinculada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmissionSource'
    get:
      tags: [J1]
      summary: Listar fontes de emissão da unidade
      description: Lista todas as fontes ativas registadas para esta unidade.
      operationId: listEmissionSources
      x-roles: ["admin_esg", "analista_controladoria", "operador_unidade", "auditor"]
      parameters:
        - $ref: '#/components/parameters/FacilityIdParam'
      responses:
        '200':
          description: Lista de fontes de emissão
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EmissionSource'

  /catalogs/source-types:
    get:
      tags: [J1]
      summary: Obter catálogo de tipos de fonte
      description: Retorna os tipos permitidos de fontes de emissão para a coleta guiada (Escopos 1 e 2).
      operationId: getSourceTypesCatalog
      x-roles: ["admin_esg", "analista_controladoria", "operador_unidade", "auditor"]
      responses:
        '200':
          description: Catálogo
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
                  example: "mobile_combustion"

  /facilities/{facilityId}/records:
    post:
      tags: [J2]
      summary: Registar atividade mensal
      description: Cria um registo de atividade mensal para uma fonte específica.
      operationId: createActivityRecord
      x-roles: ["admin_esg", "operador_unidade"]
      parameters:
        - $ref: '#/components/parameters/FacilityIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActivityRecordCreate'
      responses:
        '201':
          description: Registo criado (estado pendente)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityRecord'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
    get:
      tags: [J2]
      summary: Listar registos mensais
      description: Lista os registos da unidade por período.
      operationId: listActivityRecords
      x-roles: ["admin_esg", "analista_controladoria", "operador_unidade", "auditor"]
      parameters:
        - $ref: '#/components/parameters/FacilityIdParam'
        - name: period
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/Period'
      responses:
        '200':
          description: Lista de registos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ActivityRecord'

  /facilities/{facilityId}/records/{recordId}/correct:
    post:
      tags: [J2]
      summary: Correção retroativa de registo
      description: Cria uma nova revisão para um registo existente, marcando a justificação.
      operationId: correctActivityRecord
      x-roles: ["admin_esg", "operador_unidade"]
      parameters:
        - $ref: '#/components/parameters/FacilityIdParam'
        - $ref: '#/components/parameters/RecordIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActivityRecordCorrection'
      responses:
        '201':
          description: Nova revisão criada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityRecord'

  /facilities/{facilityId}/records/{recordId}/approve:
    post:
      tags: [J2]
      summary: Aprovar registo
      description: Aprova um registo, tornando-o elegível para cálculo.
      operationId: approveActivityRecord
      x-roles: ["admin_esg", "analista_controladoria"]
      parameters:
        - $ref: '#/components/parameters/FacilityIdParam'
        - $ref: '#/components/parameters/RecordIdParam'
      responses:
        '200':
          description: Registo aprovado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityRecord'

  /methodologies:
    get:
      tags: [J3]
      summary: Listar metodologias
      description: Lista metodologias de cálculo disponíveis.
      operationId: listMethodologies
      x-roles: ["admin_esg", "analista_controladoria", "auditor"]
      responses:
        '200':
          description: Lista de metodologias
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Methodology'

  /methodologies/{methodologyId}/factor-versions:
    post:
      tags: [J3]
      summary: Publicar nova versão de fatores
      description: Publica uma nova versão imutável de fatores de conversão.
      operationId: publishFactorVersion
      x-roles: ["admin_esg"]
      parameters:
        - $ref: '#/components/parameters/MethodologyIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FactorVersionCreate'
      responses:
        '201':
          description: Versão de fatores publicada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FactorVersion'
    get:
      tags: [J3]
      summary: Listar versões de fatores
      description: Lista as versões de fatores de uma metodologia.
      operationId: listFactorVersions
      x-roles: ["admin_esg", "analista_controladoria", "auditor"]
      parameters:
        - $ref: '#/components/parameters/MethodologyIdParam'
      responses:
        '200':
          description: Lista de versões
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FactorVersion'

  /calculations:
    post:
      tags: [J3]
      summary: Criar cálculo
      description: >
        Executa o cálculo de emissões para um período. 
        Utiliza identificação por conteúdo (hash). Se a requisição e as entradas resultarem 
        no mesmo hash de um cálculo já existente, devolve 200 OK com o recurso prévio.
      operationId: createCalculation
      x-roles: ["admin_esg", "analista_controladoria"]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CalculationRequest'
      responses:
        '201':
          description: Cálculo processado com sucesso (novo identificador)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Calculation'
        '200':
          description: Cálculo idêntico já existente (Cena da Demo - recalcular com o mesmo fator)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Calculation'
              examples:
                recalculo_identico:
                  summary: Recálculo devolve exato mesmo hash e resultados
                  value:
                    id: "calc_8f4e2d1a"
                    contentHash: "sha256:8f4e2d1a..."
                    period: "2026-05"
                    methodologyVersion: "v1.0"
                    roundingPolicy: "ROUND_HALF_EVEN"
                    totalEmissionsCo2e: "0.24500"
                    details:
                      - source: "Eletricidade"
                        quantity: "100.00"
                        factorApplied: "0.00245"
                        emissions: "0.24500"
        '409':
          $ref: '#/components/responses/Conflict'
    get:
      tags: [J3]
      summary: Listar cálculos
      description: Lista cálculos executados por período.
      operationId: listCalculations
      x-roles: ["admin_esg", "analista_controladoria", "auditor"]
      parameters:
        - name: period
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/Period'
      responses:
        '200':
          description: Lista de cálculos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Calculation'

  /dashboard/summary:
    get:
      tags: [J4]
      summary: Resumo da rede
      description: Agregado de emissões de todas as unidades para um período.
      operationId: getNetworkSummary
      x-roles: ["admin_esg", "analista_controladoria"]
      parameters:
        - name: period
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/Period'
      responses:
        '200':
          description: Dados consolidados
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NetworkSummary'

  /dashboard/outliers:
    get:
      tags: [J4]
      summary: Análise de outliers pela mediana
      description: >
        Identifica as franquias cujas emissões se desviam substancialmente da mediana da rede 
        (ex: desvio relativo superior a 50% face à mediana).
      operationId: getOutliers
      x-roles: ["admin_esg", "analista_controladoria"]
      parameters:
        - name: period
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/Period'
      responses:
        '200':
          description: Lista de unidades outliers e a métrica central
          content:
            application/json:
              schema:
                type: object
                properties:
                  networkMedianEmissions:
                    $ref: '#/components/schemas/DecimalString'
                  outliers:
                    type: array
                    items:
                      $ref: '#/components/schemas/Outlier'
              examples:
                demo_outliers:
                  summary: Comparação com a mediana da rede
                  value:
                    networkMedianEmissions: "45.000"
                    outliers:
                      - facilityId: "fac_999"
                        emissions: "120.500"
                        deviationPercentage: "167.77"

  /reports:
    post:
      tags: [J5]
      summary: Gerar relatório (Assíncrono)
      description: Solicita a geração de um relatório PDF ou CSV com a trilha de auditoria completa.
      operationId: generateReport
      x-roles: ["admin_esg", "auditor"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                format:
                  type: string
                  enum: [pdf, csv]
                period:
                  $ref: '#/components/schemas/Period'
      responses:
        '202':
          description: Pedido de geração aceite
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportJob'

  /reports/{reportId}/download:
    get:
      tags: [J5]
      summary: Obter link de download do relatório
      description: Retorna uma URL assinada (temporária) do Cloud Storage para baixar o ficheiro.
      operationId: downloadReport
      x-roles: ["admin_esg", "auditor"]
      parameters:
        - name: reportId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: URL assinada devolvida
          content:
            application/json:
              schema:
                type: object
                properties:
                  downloadUrl:
                    type: string
                    format: uri
                  expiresAt:
                    type: string
                    format: date-time

  /audit-events:
    get:
      tags: [J5]
      summary: Consultar trilha de auditoria
      description: Histórico imutável de ações no sistema (ex. registos aprovados, correções, recálculos).
      operationId: listAuditEvents
      x-roles: ["admin_esg", "auditor"]
      parameters:
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/CursorParam'
      responses:
        '200':
          description: Lista paginada de eventos
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/AuditEvent'
                  nextCursor:
                    type: ["string", "null"]

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  
  parameters:
    LimitParam:
      name: limit
      in: query
      schema:
        type: integer
        default: 20
    CursorParam:
      name: cursor
      in: query
      schema:
        type: string
    FacilityIdParam:
      name: facilityId
      in: path
      required: true
      schema:
        type: string
    RecordIdParam:
      name: recordId
      in: path
      required: true
      schema:
        type: string
    MethodologyIdParam:
      name: methodologyId
      in: path
      required: true
      schema:
        type: string
    IdempotencyKeyHeader:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string

  schemas:
    DecimalString:
      type: string
      pattern: '^-?\d+(\.\d+)?$'
      description: Número decimal exato formatado como string, com o ponto a separar a dízima.
    Period:
      type: string
      pattern: '^\d{4}-(0[1-9]|1[0-2])$'
      description: Período no formato AAAA-MM
    UserProfile:
      type: object
      properties:
        uid: { type: string }
        tenantId: { type: string }
        role: { type: string }
    Facility:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        isActive: { type: boolean }
    FacilityCreate:
      type: object
      required: [name]
      properties:
        name: { type: string }
    FacilityUpdate:
      type: object
      properties:
        name: { type: string }
        isActive: { type: boolean }
    EmissionSource:
      type: object
      properties:
        id: { type: string }
        type: { type: string }
        isActive: { type: boolean }
    EmissionSourceCreate:
      type: object
      required: [type]
      properties:
        type: { type: string }
    ActivityRecord:
      type: object
      properties:
        id: { type: string }
        sourceId: { type: string }
        period: { $ref: '#/components/schemas/Period' }
        quantity: { $ref: '#/components/schemas/DecimalString' }
        unit: { type: string }
        status: { type: string, enum: [pending, approved, replaced] }
        revision: { type: integer }
    ActivityRecordCreate:
      type: object
      required: [sourceId, period, quantity, unit]
      properties:
        sourceId: { type: string }
        period: { $ref: '#/components/schemas/Period' }
        quantity: { $ref: '#/components/schemas/DecimalString' }
        unit: { type: string }
    ActivityRecordCorrection:
      type: object
      required: [quantity, justification]
      properties:
        quantity: { $ref: '#/components/schemas/DecimalString' }
        justification: { type: string }
    Methodology:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
    FactorVersion:
      type: object
      properties:
        versionId: { type: string }
        validFrom: { type: string, format: date }
        isObsolete: { type: boolean }
    FactorVersionCreate:
      type: object
      required: [validFrom, data]
      properties:
        validFrom: { type: string, format: date }
        data: { type: object }
    CalculationRequest:
      type: object
      required: [period]
      properties:
        period: { $ref: '#/components/schemas/Period' }
        facilityId: { type: string }
    Calculation:
      type: object
      properties:
        id: { type: string }
        contentHash: { type: string }
        totalEmissionsCo2e: { $ref: '#/components/schemas/DecimalString' }
    NetworkSummary:
      type: object
      properties:
        period: { $ref: '#/components/schemas/Period' }
        calculationIdsUsed:
          type: array
          items: { type: string }
        totalEmissionsCo2e: { $ref: '#/components/schemas/DecimalString' }
    Outlier:
      type: object
      properties:
        facilityId: { type: string }
        emissions: { $ref: '#/components/schemas/DecimalString' }
        deviationPercentage: { $ref: '#/components/schemas/DecimalString' }
    ReportJob:
      type: object
      properties:
        jobId: { type: string }
        status: { type: string, enum: [processing, completed, failed] }
    AuditEvent:
      type: object
      properties:
        eventId: { type: string }
        action: { type: string }
        actorUid: { type: string }
        timestamp: { type: string, format: date-time }
    ErrorProblem:
      type: object
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        code: { type: string }
        traceId: { type: string }
        errors:
          type: array
          items:
            type: object
            properties:
              field: { type: string }
              message: { type: string }

  responses:
    UnprocessableEntity:
      description: Erro de validação dos dados enviados
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ErrorProblem'
          examples:
            erro_validacao:
              summary: Erro 422 de validação
              value:
                type: "https://api.carbontrace.com/errors/validation"
                title: "Unprocessable Entity"
                status: 422
                detail: "A requisição contém parâmetros inválidos."
                code: "VALIDATION_ERROR"
                traceId: "tr_123456"
                errors:
                  - field: "quantity"
                    message: "A quantidade deve ser um número decimal válido como string."
    Unauthorized:
      description: Token em falta ou inválido
    NotFound:
      description: Recurso não encontrado
    Conflict:
      description: Conflito de estado ou idempotência violada

security:
  - bearerAuth: []