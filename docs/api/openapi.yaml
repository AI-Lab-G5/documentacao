        baseRevision:
          type: integer
          minimum: 1
        quantity:
          $ref: '#/components/schemas/QuantityString'
        unit:
          $ref: '#/components/schemas/Unit'
        justification:
          $ref: '#/components/schemas/Reason'
      examples:
      - baseRevision: 1
        quantity: '1.2'
        unit: MWh
        justification: Conferência da conta
    ActivityRecordCancellation:
