  /dashboard/summary:
    get:
      tags:
      - J4
      operationId: getSummary
      summary: Consultar total e ranking do snapshot
      description: Somar o snapshot completo autorizado, não a página. Itens incluem completas e pendentes; completas/ativas
        com >=1 fonte são ordenadas por total decrescente/código e recebem posição. Pendentes sem posição. Totais
        parciais/ausência explícitos. Mediana calculada somente das elegíveis, inclusive zeros; exibição em 3 casas
        ROUND_HALF_EVEN com diferença de arredondamento.
      responses:
        '200':
          description: Operação concluída
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NetworkSummary'
              example:
                calculationId: calc-A
                period: 2026-10
                scope1KgCo2e: '0'
                scope2KgCo2e: '50'
                totalKgCo2e: '50'
                displayTotalKgCo2e: '50.000'
                displaySumFacilitiesKgCo2e: '50.000'
                displayRoundingDifferenceKgCo2e: '0.000'
                eligibleFacilityCount: 1
                medianKgCo2e: '50'
                comparisonStatus: insufficient_sample
                items:
                - facility:
                    facilityId: fac-1
                    code: LOJA-01
                    name: Loja Centro
                    isActive: true
                    expectedSourceIds:
                    - src-A
                    missingSourceIds: []
                    complete: true
                    scope1KgCo2e: '0'
                    scope2KgCo2e: '50'
                    totalKgCo2e: '50'
                  rankingPosition: 1
                  deviationPercentage: null
                  isOutlier: null
                nextCursor: null
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '422':
